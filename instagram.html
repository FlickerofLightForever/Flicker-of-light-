<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="description" content="Follow Flicker of Light on Instagram for stories, fragments, and pieces of the journey.">
  <meta name="theme-color" content="#0b0908">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flicker of Light — Instagram</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <a class="logo" href="index.html">flicker of light ♡</a>
  <button class="menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false">☰</button>
  <nav class="site-nav" aria-label="Main navigation">
    <a href="index.html">Home</a>
    <a href="stories.html">Stories</a>
    <a href="quotes.html">Quotes</a>
    <a href="about.html">About</a>
    <a class="active" href="instagram.html">Instagram</a>
  </nav>
</header>

<main>
  <section class="page-intro instagram-intro">
    <p class="eyebrow">BEYOND THE PAGE</p>
    <h1>Follow the Light</h1>
    <p>The stories continue beyond the page.</p>
  </section>

  <section class="instagram-copy">
    <p class="instagram-handle">@flicker_of_light_forever</p>
    <p>Stories, fragments, and pieces of the journey shared along the way.</p>

    <a class="instagram-button" href="https://www.instagram.com/flicker_of_light_forever/" target="_blank" rel="noopener noreferrer">
      Visit Instagram <span>→</span>
    </a>
  </section>
</main>

<footer>
  <p>Some stories are meant to linger.</p>
  <p>© Flicker of Light</p>
</footer>

<script>
(function () {
  const button = document.querySelector('.menu-toggle');
  const nav = document.querySelector('.site-nav');
  if (!button || !nav) return;
  button.addEventListener('click', function () {
    const open = nav.classList.toggle('open');
    button.setAttribute('aria-expanded', open ? 'true' : 'false');
    button.setAttribute('aria-label', open ? 'Close navigation' : 'Open navigation');
  });
})();
</script>
</body>
</html>
