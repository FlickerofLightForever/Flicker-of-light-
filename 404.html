<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080807">
  <title>Page Not Found — Flicker of Light</title>
  <meta name="description" content="Some pages disappear. The story doesn't. Return to Flicker of Light.">
  <link rel="stylesheet" href="style.css">
  <style>
    .error-page{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:7rem 1.5rem 4rem;box-sizing:border-box}
    .error-inner{max-width:720px}
    .error-code{font-family:Georgia,serif;font-size:clamp(5rem,20vw,9rem);line-height:.9;margin:0 0 1.5rem;color:#eee7dc;font-weight:400}
    .error-page h1{font-family:Georgia,serif;font-size:clamp(2rem,7vw,3.6rem);font-weight:400;color:#eee7dc;margin:.5rem 0 1.25rem}
    .error-page p{font-family:Georgia,serif;font-size:1.2rem;line-height:1.8;color:#aaa39a;margin:0 auto 2.5rem}
    .error-page .eyebrow{font-family:Arial,sans-serif;letter-spacing:.28em;text-transform:uppercase;font-size:.75rem;color:#b9a87c}
    .error-link{display:inline-flex;align-items:center;gap:1rem;border:1px solid #6e5d32;padding:1rem 1.6rem;color:#eee7dc;text-decoration:none;letter-spacing:.18em;text-transform:uppercase;font-family:Arial,sans-serif;font-size:.78rem}
    .error-link:hover{border-color:#b9a87c}
  </style>
</head>
<body>
  <main class="error-page">
    <div class="error-inner">
      <div class="eyebrow">A FLICKER IN THE DARK</div>
      <div class="error-code">404</div>
      <h1>Some pages disappear.<br>The story doesn't.</h1>
      <p>The page you were looking for may have wandered somewhere else.</p>
      <a class="error-link" href="index.html">RETURN HOME <span>→</span></a>
    </div>
  </main>
</body>
</html>
